<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="35%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#300a03"/>
    </linearGradient>
    <radialGradient id="abyssGlow" cx="50%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#3a1500" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a0500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="70%" cy="15%" r="20%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#abyssGlow)"/>
  <rect width="1920" height="1080" fill="url(#moonGlow)"/>

  <!-- Distant canyon walls (background) -->
  <rect x="0" y="250" width="600" height="830" fill="#1a0e04" opacity="0.7"/>
  <rect x="1320" y="250" width="600" height="830" fill="#1a0e04" opacity="0.7"/>

  <!-- Left cliff edge -->
  <polygon points="0,400 580,400 560,450 540,480 520,500 480,520 440,540 380,550 300,555 200,548 100,540 0,535" fill="#2a1808"/>
  <rect x="0" y="535" width="580" height="545" fill="#200e04"/>

  <!-- Right cliff edge -->
  <polygon points="1920,400 1340,400 1360,450 1380,480 1400,500 1440,520 1480,540 1540,550 1620,555 1720,548 1820,540 1920,535" fill="#2a1808"/>
  <rect x="1340" y="535" width="580" height="545" fill="#200e04"/>

  <!-- Abyss - deep void between cliffs -->
  <rect x="540" y="400" width="840" height="680" fill="#080402"/>
  <!-- Abyss depth gradient -->
  <rect x="540" y="400" width="840" height="680" fill="url(#abyssGlow)" opacity="0.6"/>
  <!-- Abyss mist -->
  <ellipse cx="960" cy="730" rx="450" ry="80" fill="#200a02" opacity="0.5"/>
  <ellipse cx="960" cy="820" rx="380" ry="60" fill="#180802" opacity="0.4"/>

  <!-- Rope bridge structure -->
  <!-- Main ropes (left to right) -->
  <path d="M 520,430 Q 960,480 1400,430" fill="none" stroke="#5a3010" stroke-width="10" stroke-linecap="round"/>
  <path d="M 520,460 Q 960,510 1400,460" fill="none" stroke="#5a3010" stroke-width="10" stroke-linecap="round"/>
  <!-- Lower ropes for floor -->
  <path d="M 540,520 Q 960,565 1380,520" fill="none" stroke="#4a2808" stroke-width="6"/>
  <path d="M 540,540 Q 960,580 1380,540" fill="none" stroke="#4a2808" stroke-width="6"/>

  <!-- Vertical rope supports -->
  <line x1="600" y1="440" x2="600" y2="522" stroke="#5a3010" stroke-width="5"/>
  <line x1="660" y1="447" x2="660" y2="526" stroke="#5a3010" stroke-width="5"/>
  <line x1="720" y1="453" x2="720" y2="530" stroke="#5a3010" stroke-width="5"/>
  <line x1="780" y1="458" x2="780" y2="533" stroke="#5a3010" stroke-width="5"/>
  <line x1="840" y1="462" x2="840" y2="536" stroke="#5a3010" stroke-width="5"/>
  <line x1="900" y1="465" x2="900" y2="537" stroke="#5a3010" stroke-width="5"/>
  <line x1="960" y1="466" x2="960" y2="538" stroke="#5a3010" stroke-width="5"/>
  <line x1="1020" y1="465" x2="1020" y2="537" stroke="#5a3010" stroke-width="5"/>
  <line x1="1080" y1="463" x2="1080" y2="536" stroke="#5a3010" stroke-width="5"/>
  <line x1="1140" y1="459" x2="1140" y2="533" stroke="#5a3010" stroke-width="5"/>
  <line x1="1200" y1="455" x2="1200" y2="530" stroke="#5a3010" stroke-width="5"/>
  <line x1="1260" y1="449" x2="1260" y2="526" stroke="#5a3010" stroke-width="5"/>
  <line x1="1320" y1="443" x2="1320" y2="521" stroke="#5a3010" stroke-width="5"/>

  <!-- Bridge planks (some missing/broken for danger) -->
  <rect x="578" y="522" width="55" height="16" rx="2" fill="#4a2810"/>
  <rect x="638" y="526" width="55" height="16" rx="2" fill="#422610"/>
  <rect x="698" y="529" width="55" height="16" rx="2" fill="#4a2810"/>
  <!-- MISSING PLANK at 758 - danger! -->
  <rect x="818" y="533" width="55" height="16" rx="2" fill="#4a2810"/>
  <rect x="878" y="535" width="55" height="16" rx="2" fill="#3a2008"/>
  <rect x="938" y="536" width="55" height="16" rx="2" fill="#4a2810"/>
  <rect x="998" y="535" width="55" height="16" rx="2" fill="#422610"/>
  <!-- BROKEN PLANK at 1058 - hanging -->
  <rect x="1058" y="534" width="28" height="14" rx="2" fill="#3a1c08" transform="rotate(20, 1058, 541)"/>
  <rect x="1118" y="530" width="55" height="16" rx="2" fill="#4a2810"/>
  <rect x="1178" y="527" width="55" height="16" rx="2" fill="#422610"/>
  <rect x="1238" y="524" width="55" height="16" rx="2" fill="#4a2810"/>
  <rect x="1298" y="520" width="55" height="16" rx="2" fill="#3a2008"/>

  <!-- Anchor posts on cliffs -->
  <rect x="500" y="390" width="25" height="150" rx="4" fill="#3a1a08"/>
  <rect x="1395" y="390" width="25" height="150" rx="4" fill="#3a1a08"/>

  <!-- Explorer on left cliff edge looking -->
  <!-- Hat -->
  <rect x="406" y="438" width="54" height="44" rx="5" fill="#1a0e04"/>
  <ellipse cx="433" cy="484" rx="65" ry="13" fill="#110a02"/>
  <!-- Head -->
  <circle cx="433" cy="515" r="40" fill="#1a0e04"/>
  <!-- Beak -->
  <ellipse cx="466" cy="521" rx="20" ry="10" fill="#201408"/>
  <!-- Body -->
  <ellipse cx="433" cy="590" rx="48" ry="58" fill="#1a0e04"/>
  <!-- Arm extended pointing at bridge (cautious gesture) -->
  <line x1="476" y1="568" x2="530" y2="555" stroke="#110a02" stroke-width="10" stroke-linecap="round"/>
  <line x1="390" y1="568" x2="355" y2="610" stroke="#110a02" stroke-width="9" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="415" y1="643" x2="398" y2="700" stroke="#1a0e04" stroke-width="14" stroke-linecap="round"/>
  <line x1="451" y1="643" x2="468" y2="700" stroke="#1a0e04" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="396" cy="705" rx="20" ry="10" fill="#110a02"/>
  <ellipse cx="470" cy="705" rx="20" ry="10" fill="#110a02"/>

  <!-- Warning triangles floating -->
  <polygon points="960,170 1060,360 860,360" fill="none" stroke="#ff6600" stroke-width="9" opacity="0.9" filter="url(#glow)"/>
  <text x="960" y="335" text-anchor="middle"
    font-family="Arial Black, sans-serif"
    font-size="100" fill="#ff6600" opacity="0.9" filter="url(#glow)">!</text>
  <!-- Small secondary warning -->
  <polygon points="1400,200 1450,290 1350,290" fill="none" stroke="#ff6600" stroke-width="6" opacity="0.7"/>
  <text x="1400" y="276" text-anchor="middle"
    font-family="Arial Black, sans-serif"
    font-size="60" fill="#ff6600" opacity="0.7">!</text>

  <!-- SST Badge -->
  <rect x="760" y="950" width="400" height="50" rx="25" fill="#cc4400" opacity="0.9"/>
  <text x="960" y="984" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20" font-weight="700" fill="white" letter-spacing="5">SST — SEGURIDAD</text>

  <!-- Scene title -->
  <text x="960" y="100" text-anchor="middle"
    font-family="Arial Black, sans-serif"
    font-size="72" font-weight="900"
    fill="#ff8844" opacity="0.95" letter-spacing="2">PUENTE INESTABLE</text>
  <rect x="460" y="112" width="1000" height="6" fill="#ff6600" rx="3"/>
  <text x="960" y="178" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28" fill="#cc7744" letter-spacing="2">¿Cruzas sin revisar el equipo?</text>
</svg>

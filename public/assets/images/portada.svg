<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="55%" stop-color="#150508"/>
      <stop offset="100%" stop-color="#2a0a03"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="12%" r="25%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff8dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#e60000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e60000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#moonGlow)"/>
  <rect width="1920" height="1080" fill="url(#redGlow)"/>

  <!-- Stars -->
  <circle cx="200" cy="80" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="380" cy="55" r="2" fill="white" opacity="0.5"/>
  <circle cx="520" cy="100" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="680" cy="45" r="1" fill="white" opacity="0.8"/>
  <circle cx="840" cy="75" r="2" fill="white" opacity="0.4"/>
  <circle cx="1050" cy="35" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="1220" cy="90" r="1" fill="white" opacity="0.6"/>
  <circle cx="1380" cy="50" r="2" fill="white" opacity="0.5"/>
  <circle cx="1540" cy="110" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="1720" cy="65" r="1" fill="white" opacity="0.5"/>
  <circle cx="1850" cy="95" r="2" fill="white" opacity="0.6"/>
  <circle cx="290" cy="160" r="1" fill="white" opacity="0.4"/>
  <circle cx="760" cy="130" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="1100" cy="150" r="1" fill="white" opacity="0.6"/>
  <circle cx="1600" cy="140" r="1.5" fill="white" opacity="0.4"/>

  <!-- Moon -->
  <circle cx="960" cy="115" r="55" fill="#fff8dc" opacity="0.12"/>
  <circle cx="960" cy="115" r="38" fill="#fff8dc" opacity="0.18"/>
  <circle cx="960" cy="115" r="22" fill="#fff8dc" opacity="0.25"/>

  <!-- Ground base -->
  <rect x="0" y="820" width="1920" height="260" fill="#060a03"/>

  <!-- Left jungle trees -->
  <rect x="-10" y="350" width="90" height="750" fill="#040802" rx="5"/>
  <ellipse cx="50" cy="340" rx="130" ry="160" fill="#040802"/>
  <ellipse cx="30" cy="300" rx="90" ry="120" fill="#050a03"/>

  <rect x="120" y="450" width="70" height="650" fill="#050a03" rx="4"/>
  <ellipse cx="160" cy="440" rx="110" ry="140" fill="#050a03"/>

  <rect x="220" y="520" width="55" height="560" fill="#060b04" rx="3"/>
  <ellipse cx="250" cy="510" rx="95" ry="120" fill="#060b04"/>

  <rect x="300" y="580" width="45" height="500" fill="#050a03" rx="3"/>
  <ellipse cx="325" cy="570" rx="80" ry="100" fill="#050a03"/>

  <!-- Right jungle trees -->
  <rect x="1840" y="350" width="90" height="750" fill="#040802" rx="5"/>
  <ellipse cx="1870" cy="340" rx="130" ry="160" fill="#040802"/>
  <ellipse cx="1890" cy="300" rx="90" ry="120" fill="#050a03"/>

  <rect x="1730" y="450" width="70" height="650" fill="#050a03" rx="4"/>
  <ellipse cx="1760" cy="440" rx="110" ry="140" fill="#050a03"/>

  <rect x="1645" y="520" width="55" height="560" fill="#060b04" rx="3"/>
  <ellipse cx="1670" cy="510" rx="95" ry="120" fill="#060b04"/>

  <rect x="1575" y="580" width="45" height="500" fill="#050a03" rx="3"/>
  <ellipse cx="1595" cy="570" rx="80" ry="100" fill="#050a03"/>

  <!-- Foreground ground details -->
  <rect x="0" y="900" width="1920" height="180" fill="#040602"/>
  <ellipse cx="480" cy="900" rx="300" ry="50" fill="#050802"/>
  <ellipse cx="1440" cy="900" rx="300" ry="50" fill="#050802"/>

  <!-- Path / light trail -->
  <ellipse cx="960" cy="850" rx="200" ry="30" fill="#e60000" opacity="0.08"/>
  <ellipse cx="960" cy="860" rx="120" ry="18" fill="#e60000" opacity="0.06"/>

  <!-- Red accent line -->
  <rect x="0" y="218" width="1920" height="5" fill="#e60000" opacity="0.85"/>

  <!-- AVEFLIX title - shadow layer -->
  <text x="963" y="388" text-anchor="middle"
    font-family="Impact, Arial Black, sans-serif"
    font-size="200" font-weight="900"
    fill="#e60000" opacity="0.35" filter="url(#softglow)">AveFlix</text>

  <!-- AVEFLIX title - main -->
  <text x="960" y="385" text-anchor="middle"
    font-family="Impact, Arial Black, sans-serif"
    font-size="200" font-weight="900"
    fill="white" opacity="0.97">AveFlix</text>

  <!-- Red underline -->
  <rect x="510" y="402" width="900" height="9" fill="#e60000" rx="5"/>

  <!-- Subtitle -->
  <text x="960" y="490" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="44" font-weight="700"
    fill="#dddddd" letter-spacing="10">TEMPORADA 1: EL ORIGEN</text>

  <!-- Tagline -->
  <text x="960" y="552" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="26" fill="#888888" letter-spacing="5">EN BUSCA DEL TESORO</text>

  <!-- Explorer silhouette (simplified duck explorer) -->
  <!-- Hat top -->
  <rect x="928" y="582" width="64" height="48" rx="6" fill="#1a0400"/>
  <!-- Hat brim -->
  <ellipse cx="960" cy="630" rx="72" ry="13" fill="#0f0200"/>
  <!-- Head -->
  <circle cx="960" cy="665" r="42" fill="#1a0400"/>
  <!-- Beak -->
  <ellipse cx="996" cy="668" rx="22" ry="10" fill="#2a0800"/>
  <!-- Body -->
  <ellipse cx="960" cy="740" rx="52" ry="60" fill="#1a0400"/>
  <!-- Arm/stick right -->
  <line x1="1005" y1="700" x2="1075" y2="800" stroke="#0f0200" stroke-width="9" stroke-linecap="round"/>
  <!-- Arm left -->
  <line x1="915" y1="710" x2="865" y2="775" stroke="#0f0200" stroke-width="8" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="940" y1="795" x2="920" y2="858" stroke="#1a0400" stroke-width="14" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="980" y1="795" x2="1002" y2="858" stroke="#1a0400" stroke-width="14" stroke-linecap="round"/>
  <!-- Boots -->
  <ellipse cx="918" cy="862" rx="20" ry="10" fill="#0f0200"/>
  <ellipse cx="1004" cy="862" rx="20" ry="10" fill="#0f0200"/>

  <!-- Bottom badge -->
  <rect x="710" y="960" width="500" height="64" rx="32" fill="#e60000" opacity="0.92"/>
  <text x="960" y="1000" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22" font-weight="700"
    fill="white" letter-spacing="4">CAPACITACIÓN CORPORATIVA AVELLANO</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080500"/>
      <stop offset="50%" stop-color="#1a0c00"/>
      <stop offset="100%" stop-color="#100800"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#cc5500" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#cc3300" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#fireGlow)"/>

  <!-- Cave walls, dark -->
  <rect x="0" y="0" width="300" height="1080" fill="#060400" opacity="0.95"/>
  <rect x="1620" y="0" width="300" height="1080" fill="#060400" opacity="0.95"/>
  <ellipse cx="960" cy="-100" rx="850" ry="400" fill="#050300" opacity="0.9"/>
  <rect x="0" y="860" width="1920" height="220" fill="#060300"/>

  <!-- Broken stone door in background -->
  <!-- Door frame - cracked/broken -->
  <rect x="620" y="250" width="680" height="650" rx="30" fill="#0d1508" stroke="#2a1800" stroke-width="8"/>

  <!-- Left door panel - blown open/stuck -->
  <rect x="630" y="250" width="325" height="650" rx="20" fill="#0c1407" stroke="#1a1200" stroke-width="3"/>
  <!-- Right panel - partially open crookedly -->
  <rect x="965" y="250" width="325" height="650" rx="20" fill="#0b1206" stroke="#1a1200" stroke-width="3"/>

  <!-- Cracked gears - broken and jammed -->
  <!-- Left gear - cracked, sparking -->
  <circle cx="790" cy="545" r="80" fill="none" stroke="#3a1a00" stroke-width="12"/>
  <circle cx="790" cy="545" r="60" fill="#150a00" stroke="#2a1400" stroke-width="6"/>
  <circle cx="790" cy="545" r="20" fill="#150a00" stroke="#cc4400" stroke-width="4"/>
  <!-- Broken/missing gear teeth -->
  <rect x="770" y="457" width="40" height="22" rx="4" fill="#3a1a00"/>
  <rect x="770" y="621" width="40" height="22" rx="4" fill="#3a1a00"/>
  <rect x="702" y="525" width="22" height="40" rx="4" fill="#3a1a00"/>
  <!-- Missing teeth at right/top positions - indicating jam -->

  <!-- Crack lines on left gear -->
  <line x1="790" y1="465" x2="760" y2="510" stroke="#ff6600" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
  <line x1="820" y1="490" x2="800" y2="545" stroke="#ff4400" stroke-width="2" opacity="0.7" filter="url(#glow)"/>
  <line x1="748" y1="560" x2="790" y2="545" stroke="#ff5500" stroke-width="2" opacity="0.8" filter="url(#glow)"/>

  <!-- Right gear - also jammed/broken -->
  <circle cx="1130" cy="545" r="80" fill="none" stroke="#3a1a00" stroke-width="12"/>
  <circle cx="1130" cy="545" r="60" fill="#120900" stroke="#2a1400" stroke-width="6"/>
  <circle cx="1130" cy="545" r="20" fill="#120900" stroke="#cc4400" stroke-width="4"/>
  <rect x="1110" y="457" width="40" height="22" rx="4" fill="#3a1a00"/>
  <rect x="1206" y="525" width="22" height="40" rx="4" fill="#3a1a00"/>
  <!-- Crack lines on right gear -->
  <line x1="1130" y1="465" x2="1160" y2="510" stroke="#ff6600" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
  <line x1="1098" y1="495" x2="1130" y2="545" stroke="#ff4400" stroke-width="2" opacity="0.7" filter="url(#glow)"/>

  <!-- Broken connecting rod - snapped in middle -->
  <rect x="870" y="530" width="35" height="30" rx="10" fill="#2a1800" stroke="#1a1000" stroke-width="2"/>
  <rect x="953" y="530" width="35" height="30" rx="10" fill="#2a1800" stroke="#1a1000" stroke-width="2"/>
  <!-- Gap / break point with sparks -->
  <ellipse cx="943" cy="545" rx="25" ry="20" fill="#cc4400" opacity="0.3" filter="url(#glow)"/>

  <!-- Sparks / embers flying -->
  <circle cx="900" cy="490" r="4" fill="#ff8800" opacity="0.9" filter="url(#glow)"/>
  <circle cx="920" cy="460" r="3" fill="#ff6600" opacity="0.8" filter="url(#glow)"/>
  <circle cx="870" cy="500" r="5" fill="#ffaa00" opacity="0.85" filter="url(#glow)"/>
  <circle cx="950" cy="480" r="3" fill="#ff9900" opacity="0.75" filter="url(#glow)"/>
  <circle cx="1000" cy="495" r="4" fill="#ff7700" opacity="0.8" filter="url(#glow)"/>
  <circle cx="1030" cy="465" r="3" fill="#ff8800" opacity="0.7" filter="url(#glow)"/>
  <circle cx="850" cy="470" r="2" fill="#ffcc00" opacity="0.7" filter="url(#glow)"/>
  <circle cx="1060" cy="480" r="3" fill="#ffaa00" opacity="0.8" filter="url(#glow)"/>

  <!-- Smoke wisps from gear -->
  <ellipse cx="790" cy="440" rx="30" ry="20" fill="#1a0a00" opacity="0.5"/>
  <ellipse cx="800" cy="410" rx="22" ry="16" fill="#180a00" opacity="0.4"/>
  <ellipse cx="1130" cy="440" rx="30" ry="20" fill="#1a0a00" opacity="0.5"/>
  <ellipse cx="1120" cy="410" rx="22" ry="16" fill="#180a00" opacity="0.4"/>

  <!-- Inscription/glyph on door - now scrambled/wrong -->
  <rect x="700" y="255" width="520" height="50" rx="10" fill="#0c0800"/>
  <text x="960" y="288" text-anchor="middle"
    font-family="serif"
    font-size="24" fill="#884400" opacity="0.8" letter-spacing="8">✗ ◈ ⬡ ◈ ✗</text>

  <!-- Warning sign above mechanism -->
  <polygon points="960,160 1070,360 850,360" fill="none" stroke="#ff6600" stroke-width="9" opacity="0.9" filter="url(#glow)"/>
  <text x="960" y="335" text-anchor="middle"
    font-family="Arial Black, sans-serif"
    font-size="110" fill="#ff6600" opacity="0.9" filter="url(#glow)">!</text>

  <!-- Explorer backing away -->
  <!-- Hat -->
  <rect x="323" y="600" width="52" height="42" rx="5" fill="#1a0e04"/>
  <ellipse cx="349" cy="644" rx="63" ry="13" fill="#110a02"/>
  <!-- Head, turned slightly back in alarm -->
  <circle cx="349" cy="674" r="40" fill="#1a0e04"/>
  <!-- Beak pointing left/away -->
  <ellipse cx="315" cy="680" rx="20" ry="10" fill="#201408"/>
  <!-- Body -->
  <ellipse cx="355" cy="748" rx="46" ry="56" fill="#1a0e04" transform="rotate(8, 355, 748)"/>
  <!-- Arms raised in alarm -->
  <line x1="390" y1="725" x2="438" y2="695" stroke="#110a02" stroke-width="10" stroke-linecap="round"/>
  <line x1="318" y1="725" x2="276" y2="700" stroke="#110a02" stroke-width="9" stroke-linecap="round"/>
  <!-- Legs stepping back -->
  <line x1="337" y1="800" x2="300" y2="858" stroke="#1a0e04" stroke-width="13" stroke-linecap="round"/>
  <line x1="373" y1="800" x2="400" y2="858" stroke="#1a0e04" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="298" cy="862" rx="20" ry="10" fill="#110a02"/>
  <ellipse cx="402" cy="862" rx="20" ry="10" fill="#110a02"/>

  <!-- Scene title -->
  <text x="960" y="100" text-anchor="middle"
    font-family="Arial Black, sans-serif"
    font-size="68" font-weight="900"
    fill="#ff7722" opacity="0.95" letter-spacing="2">MECANISMO FALLIDO</text>
  <rect x="460" y="112" width="1000" height="6" fill="#cc4400" rx="3"/>
  <text x="960" y="180" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28" fill="#bb6622" letter-spacing="2">El procedimiento fue aplicado incorrectamente.</text>

  <!-- SIG Badge -->
  <rect x="760" y="950" width="400" height="50" rx="25" fill="#663300" opacity="0.9"/>
  <text x="960" y="984" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20" font-weight="700" fill="#ffccaa" letter-spacing="4">SIG &amp; CALIDAD</text>
</svg>

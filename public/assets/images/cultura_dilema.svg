<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050e1a"/>
      <stop offset="50%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#0d1a10"/>
    </linearGradient>
    <radialGradient id="leftLight" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#1a4a8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a4a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightLight" cx="70%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#0a3a60" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a3a60" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#leftLight)"/>
  <rect width="1920" height="1080" fill="url(#rightLight)"/>

  <!-- Atmospheric fog layer -->
  <rect x="0" y="500" width="1920" height="300" fill="#0a1a15" opacity="0.4"/>

  <!-- Left jungle wall -->
  <rect x="0" y="200" width="100" height="880" fill="#040b05"/>
  <ellipse cx="60" cy="190" rx="140" ry="170" fill="#040b05"/>
  <rect x="80" y="300" width="80" height="780" fill="#050c06"/>
  <ellipse cx="125" cy="285" rx="120" ry="150" fill="#050c06"/>
  <rect x="170" y="380" width="65" height="700" fill="#060d07"/>
  <ellipse cx="205" cy="365" rx="105" ry="130" fill="#060d07"/>
  <rect x="250" y="440" width="55" height="640" fill="#050c06"/>
  <ellipse cx="280" cy="425" rx="90" ry="115" fill="#050c06"/>

  <!-- Right jungle wall -->
  <rect x="1820" y="200" width="100" height="880" fill="#040b05"/>
  <ellipse cx="1860" cy="190" rx="140" ry="170" fill="#040b05"/>
  <rect x="1760" y="300" width="80" height="780" fill="#050c06"/>
  <ellipse cx="1795" cy="285" rx="120" ry="150" fill="#050c06"/>
  <rect x="1685" y="380" width="65" height="700" fill="#060d07"/>
  <ellipse cx="1715" cy="365" rx="105" ry="130" fill="#060d07"/>
  <rect x="1615" y="440" width="55" height="640" fill="#050c06"/>
  <ellipse cx="1640" cy="425" rx="90" ry="115" fill="#050c06"/>

  <!-- Ground -->
  <rect x="0" y="820" width="1920" height="260" fill="#060e06"/>

  <!-- PATH LEFT - fades to dark trees -->
  <polygon points="960,820 420,1080 0,1080 0,1000 500,820" fill="#0a1508" opacity="0.8"/>
  <!-- PATH RIGHT - heading into distance -->
  <polygon points="960,820 1500,1080 1920,1080 1920,1000 1420,820" fill="#091408" opacity="0.8"/>
  <!-- PATH CENTER - continuation forward -->
  <polygon points="850,820 1070,820 1200,1080 700,1080" fill="#0c1a0a" opacity="0.7"/>

  <!-- Path light highlights -->
  <polygon points="920,820 1000,820 1060,1080 860,1080" fill="#1a3015" opacity="0.3"/>

  <!-- Mist / fog -->
  <ellipse cx="460" cy="820" rx="500" ry="80" fill="#0d1a12" opacity="0.6"/>
  <ellipse cx="1460" cy="820" rx="500" ry="80" fill="#0d1a12" opacity="0.6"/>
  <ellipse cx="960" cy="700" rx="400" ry="60" fill="#0a1510" opacity="0.5"/>

  <!-- Pillar badge - CULTURA -->
  <rect x="810" y="950" width="300" height="50" rx="25" fill="#1a4a8a" opacity="0.85"/>
  <text x="960" y="984" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20" font-weight="700" fill="white" letter-spacing="5">CULTURA</text>

  <!-- Fork sign post -->
  <!-- Post -->
  <rect x="948" y="550" width="24" height="280" fill="#3a2010" rx="4"/>
  <!-- Left sign -->
  <rect x="780" y="540" width="180" height="55" rx="8" fill="#3a2010"/>
  <text x="870" y="574" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22" font-weight="700" fill="#e60000">←  ¿Solo?</text>
  <!-- Right sign -->
  <rect x="960" y="540" width="180" height="55" rx="8" fill="#3a2010"/>
  <text x="1050" y="574" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22" font-weight="700" fill="#4adf70">Juntos  →</text>

  <!-- Explorer figure 1 - main explorer (center-left) -->
  <!-- Hat -->
  <rect x="645" y="618" width="54" height="40" rx="5" fill="#1a0e04"/>
  <ellipse cx="672" cy="658" rx="62" ry="11" fill="#110a02"/>
  <!-- Head -->
  <circle cx="672" cy="688" r="36" fill="#1a0e04"/>
  <!-- Beak -->
  <ellipse cx="702" cy="692" rx="18" ry="9" fill="#2a1a06"/>
  <!-- Body -->
  <ellipse cx="672" cy="755" rx="44" ry="52" fill="#1a0e04"/>
  <!-- Arms -->
  <line x1="716" y1="730" x2="770" y2="780" stroke="#110a02" stroke-width="8" stroke-linecap="round"/>
  <line x1="628" y1="730" x2="585" y2="775" stroke="#110a02" stroke-width="7" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="652" y1="803" x2="635" y2="858" stroke="#1a0e04" stroke-width="13" stroke-linecap="round"/>
  <line x1="692" y1="803" x2="710" y2="858" stroke="#1a0e04" stroke-width="13" stroke-linecap="round"/>
  <!-- Boots -->
  <ellipse cx="633" cy="862" rx="18" ry="9" fill="#110a02"/>
  <ellipse cx="712" cy="862" rx="18" ry="9" fill="#110a02"/>

  <!-- Map on ground near figure 1 - with X -->
  <rect x="720" y="800" width="90" height="65" rx="5" fill="#c8a050" opacity="0.8" transform="rotate(-15, 765, 832)"/>
  <line x1="735" y1="815" x2="795" y2="855" stroke="#5a3010" stroke-width="3" opacity="0.8" transform="rotate(-15, 765, 832)"/>
  <line x1="795" y1="815" x2="735" y2="855" stroke="#5a3010" stroke-width="3" opacity="0.8" transform="rotate(-15, 765, 832)"/>

  <!-- Explorer figure 2 - companion (lost, right side) further away = smaller -->
  <!-- Hat -->
  <rect x="1248" y="648" width="44" height="33" rx="4" fill="#15180a"/>
  <ellipse cx="1270" cy="681" rx="52" ry="9" fill="#0e100a"/>
  <!-- Head -->
  <circle cx="1270" cy="706" r="30" fill="#15180a"/>
  <!-- Body -->
  <ellipse cx="1270" cy="762" rx="36" ry="43" fill="#15180a"/>
  <!-- Arms confused: both raised slightly -->
  <line x1="1304" y1="745" x2="1340" y2="720" stroke="#0e100a" stroke-width="7" stroke-linecap="round"/>
  <line x1="1236" y1="745" x2="1200" y2="720" stroke="#0e100a" stroke-width="7" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="1252" y1="802" x2="1238" y2="850" stroke="#15180a" stroke-width="11" stroke-linecap="round"/>
  <line x1="1288" y1="802" x2="1304" y2="850" stroke="#15180a" stroke-width="11" stroke-linecap="round"/>
  <!-- Boots -->
  <ellipse cx="1236" cy="854" rx="16" ry="8" fill="#0e100a"/>
  <ellipse cx="1306" cy="854" rx="16" ry="8" fill="#0e100a"/>

  <!-- Question marks near figure 2 -->
  <text x="1330" y="690" font-family="Arial" font-size="40" fill="#4a8adf" opacity="0.7">?</text>
  <text x="1350" y="650" font-family="Arial" font-size="28" fill="#4a8adf" opacity="0.5">?</text>

  <!-- Scene title -->
  <text x="960" y="130" text-anchor="middle"
    font-family="Arial Black, sans-serif"
    font-size="70" font-weight="900"
    fill="white" opacity="0.92" letter-spacing="2">DILEMA DE CULTURA</text>
  <rect x="560" y="142" width="800" height="6" fill="#4a8adf" rx="3"/>

  <!-- Subtitle -->
  <text x="960" y="210" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30" fill="#a0b8d0" letter-spacing="2">¿Avanzas solo o ayudas a tu compañero?</text>
</svg>
